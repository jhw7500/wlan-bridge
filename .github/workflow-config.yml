# GitHub Actions Workflow Configuration
#
# This file controls enable/disable toggles for automatic workflows.
# Workflows should default to enabled if this file is missing.

# Shared workflow version pin for jhw7500/automation.
#
# NOTE: GitHub Actions does not allow dynamic refs in `uses: ...@ref`, so this value
# is used by a repo automation workflow that opens a PR updating all `uses:` refs.
automation_ref: v1.23

# Global review behavior.
# - manual triggers (e.g. @gemini-cli /review, @claude) should keep working regardless.
# - set review.auto=false to disable automatic PR reviews.
review:
  auto: false

# Per-workflow toggles.
# Comment-driven workflows should be explicitly controllable even in internal repos.
workflows:
  # Repo-specific CI workflows
  build-test:
    enabled: true
  shellcheck:
    enabled: true

  # Repo automation helpers
  bump-automation-ref:
    enabled: true

  # Shared automation workflow wrappers
  auto-rereview-request:
    enabled: false
  # NOTE: review.auto=false이므로 자동 PR 리뷰 워크플로우는 비활성화.
  # 자동 리뷰를 사용하려면 review.auto=true로 변경하고 아래 워크플로우도 enabled: true로 설정.
  claude-code-review:
    enabled: false
  gemini-auto-review:
    enabled: false
  gemini-dispatch:
    enabled: true
  gemini-invoke:
    enabled: true
  gemini-review:
    enabled: true
  gemini-scheduled-triage:
    enabled: false  # Disabled: 스케줄 트리거 비활성화
  gemini-triage:
    enabled: true

  opencode:
    enabled: true
  opencode-auto-review:
    enabled: false
  gemini-chat:
    enabled: true
  claude:
    enabled: true
