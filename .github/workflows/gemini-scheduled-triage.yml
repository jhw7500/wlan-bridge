name: Gemini Scheduled Issue Triage

on:
  # 자동 스케줄 비활성화. 수동 실행만 가능.
  workflow_dispatch:

jobs:
  check-enabled:
    name: Check if enabled
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github

      - name: Check workflow config
        id: check
        uses: ./.github/actions/check-workflow-enabled
        with:
          workflow-name: gemini-scheduled-triage

  triage:
    needs: check-enabled
    if: needs.check-enabled.outputs.enabled == 'true'
    permissions:
      contents: read
      id-token: write
      issues: write
      pull-requests: write
    uses: jhw7500/automation/.github/workflows/gemini-scheduled-triage.yml@v1.30
    secrets:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
