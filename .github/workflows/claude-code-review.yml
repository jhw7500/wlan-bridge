name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  config:
    runs-on: ubuntu-latest
    outputs:
      review_auto: ${{ steps.config.outputs.review_auto }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Load workflow config
        id: config
        run: |
          REVIEW_AUTO=true

          if [ -f ".github/workflow-config.yml" ]; then
            in_review=0
            while IFS= read -r line; do
              if [[ "$line" =~ ^review:[[:space:]]*$ ]]; then
                in_review=1
                continue
              fi
              if [[ $in_review -eq 1 && "$line" =~ ^[^[:space:]] ]]; then
                in_review=0
              fi
              if [[ $in_review -eq 1 && "$line" =~ ^[[:space:]]+auto:[[:space:]]*(true|false)[[:space:]]*$ ]]; then
                REVIEW_AUTO="${BASH_REMATCH[1]}"
                break
              fi
            done < ".github/workflow-config.yml"
          fi

          echo "review_auto=${REVIEW_AUTO}" >> "$GITHUB_OUTPUT"

  claude-review:
    needs: config
    if: ${{ needs.config.outputs.review_auto == 'true' }}
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Start your comment with:
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            Reviewer: Claude Code Review

            Please review this pull request and provide feedback on:
            - Code quality and best practices
            - Potential bugs or issues
            - Performance considerations
            - Security concerns
            - Test coverage

            Use the repository's CLAUDE.md for guidance on style and conventions. Be constructive and helpful in your feedback.

            Use `gh pr comment` with your Bash tool to leave your review as a comment on the PR.

          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
          claude_args: '--allowed-tools "Bash(gh issue view:*),Bash(gh search:*),Bash(gh issue list:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*)"'
