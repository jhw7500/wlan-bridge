name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  check-enabled:
    name: Check if enabled
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github

      - name: Check workflow config
        id: check
        uses: ./.github/actions/check-workflow-enabled
        with:
          workflow-name: claude-code-review

  auto-review:
    needs: check-enabled
    if: needs.check-enabled.outputs.enabled == 'true'
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    uses: jhw7500/automation/.github/workflows/claude-code-review.yml@v1.28
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
