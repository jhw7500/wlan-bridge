name: Build and Test

on:
  push:
    branches: [ main, master ]
    paths:
      - 'wbridge/**'
      - 'scripts/**'
      - '**/*.sh'
      - '.github/workflows/build-test.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'wbridge/**'
      - 'scripts/**'
      - '**/*.sh'
      - '.github/workflows/build-test.yml'
  workflow_dispatch:
    inputs:
      force_run:
        description: 'Run even if disabled'
        type: boolean
        default: false

jobs:
  check-enabled:
    name: Check if enabled
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github

      - name: Check workflow config
        id: check
        uses: ./.github/actions/check-workflow-enabled
        with:
          workflow-name: build-test
          force-run: ${{ github.event.inputs.force_run || 'false' }}

  build:
    name: Build wbridge (host-native) + unit tests
    needs: check-enabled
    if: needs.check-enabled.outputs.enabled == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libpcap-dev

      - name: Build wbridge (release + debug + tests)
        run: |
          set -euo pipefail
          make -C wbridge all

      - name: Run unit tests
        run: |
          set -euo pipefail
          make -C wbridge run-tests

      - name: Verify outputs
        run: |
          set -euo pipefail
          test -f wbridge/release/wbridge
          test -f wbridge/release/wbridge-tpacket
          test -f wbridge/debug/wbridge
          test -f wbridge/debug/wbridge-tpacket
          test -f wbridge/tests/bin/test_filter
          file wbridge/release/wbridge wbridge/release/wbridge-tpacket
          file wbridge/debug/wbridge wbridge/debug/wbridge-tpacket

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: wlan-bridge-binaries
          path: |
            wbridge/release/wbridge
            wbridge/release/wbridge-tpacket
            wbridge/debug/wbridge
            wbridge/debug/wbridge-tpacket
          if-no-files-found: error
          retention-days: 7

  skipped:
    name: Workflow Skipped
    needs: check-enabled
    if: needs.check-enabled.outputs.enabled != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Notice
        run: |
          echo "::notice::build-test workflow is disabled in .github/workflow-config.yml"
          echo "## Workflow Skipped" >> $GITHUB_STEP_SUMMARY
          echo "build-test is disabled in workflow-config.yml" >> $GITHUB_STEP_SUMMARY
