name: Build and Test

on:
  push:
    branches: [ main, master ]
    paths:
      - 'dumb/**'
      - 'scripts/**'
      - '**/*.sh'
      - '.github/workflows/build-test.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'dumb/**'
      - 'scripts/**'
      - '**/*.sh'
      - '.github/workflows/build-test.yml'
  workflow_dispatch:
    inputs:
      force_run:
        description: 'Run even if disabled'
        type: boolean
        default: false

jobs:
  check-enabled:
    name: Check if enabled
    if: ${{ github.event.inputs.force_run != 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github

      - name: Check workflow config
        id: check
        uses: ./.github/actions/check-workflow-enabled
        with:
          workflow-name: build-test

  build:
    name: Build wlan-bridge
    needs: check-enabled
    if: >-
      always() && (
        github.event.inputs.force_run == 'true' ||
        needs.check-enabled.outputs.enabled == 'true'
      )
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libpcap-dev

      - name: Build dumb
        run: |
          set -euo pipefail

          # Backward/forward compatible build:
          # - Old Makefile: `make -C dumb` -> outputs to dumb/bin/
          # - New Makefile: `make -C dumb release` / `debug` -> outputs to dumb/release/ and dumb/debug/
          if make -C dumb -n release >/dev/null 2>&1; then
            make -C dumb release
          else
            make -C dumb
          fi

          if make -C dumb -n debug >/dev/null 2>&1; then
            make -C dumb debug
          else
            echo "No debug target in dumb/Makefile, skipping debug build"
          fi

      - name: Run refactored unit tests
        run: |
          if [ -f dumb/refactored/Makefile ]; then
            make -C dumb/refactored test
          else
            echo "No dumb/refactored/Makefile found, skipping"
          fi

      - name: Verify outputs
        run: |
          set -euo pipefail

          # Determine release output directory.
          if [ -f dumb/release/dumb ]; then
            outdir="dumb/release"
          elif [ -f dumb/bin/dumb ]; then
            outdir="dumb/bin"
          else
            echo "ERROR: dumb binary not found (expected dumb/release/dumb or dumb/bin/dumb)" >&2
            exit 1
          fi

          test -f "${outdir}/dumb"
          test -f "${outdir}/dumb-tpacket"
          file "${outdir}/dumb" "${outdir}/dumb-tpacket"

          # Debug outputs are required only when a debug build target exists.
          if make -C dumb -n debug >/dev/null 2>&1; then
            test -f dumb/debug/dumb
            test -f dumb/debug/dumb-tpacket
            file dumb/debug/dumb dumb/debug/dumb-tpacket
          fi

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: wlan-bridge-binaries
          path: |
            dumb/release/dumb
            dumb/release/dumb-tpacket
            dumb/debug/dumb
            dumb/debug/dumb-tpacket
            dumb/bin/dumb
            dumb/bin/dumb-tpacket
          if-no-files-found: warn
          retention-days: 7
