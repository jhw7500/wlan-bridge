name: OpenCode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    permissions:
      contents: read
      issues: write
      pull-requests: write
    uses: jhw7500/automation/.github/workflows/opencode.yml@5ec427c540619d6fbd80ea758de8d8e0bf00d987
    secrets:
      ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
