name: OpenCode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    permissions:
      contents: read
      issues: write
      pull-requests: write
    uses: jhw7500/automation/.github/workflows/opencode.yml@0ea33644d840b1172d9713df3f1f8866fc519679
    secrets:
      ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
