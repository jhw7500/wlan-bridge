name: OpenCode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    permissions:
      contents: read
      issues: write
      pull-requests: write
    uses: jhw7500/automation/.github/workflows/opencode.yml@d3b102e2c1f62f6abf5a9a5a37da810e6ba3e7f5
    secrets:
      ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
