name: OpenCode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    permissions:
      contents: read
      issues: write
      pull-requests: write
    uses: jhw7500/automation/.github/workflows/opencode.yml@87b6e774aa67f2d280f1ce405c562dcb04e6b3d4
    secrets:
      ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
