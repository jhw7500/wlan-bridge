name: OpenCode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    permissions:
      contents: read
      issues: write
      pull-requests: write
    uses: jhw7500/automation/.github/workflows/opencode.yml@1e2dc6610c96b73bf6ec0f12ea05322f17f3122a
    secrets:
      ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
