name: OpenCode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    permissions:
      contents: read
      issues: write
      pull-requests: write
    uses: jhw7500/automation/.github/workflows/opencode.yml@09899443802eb3c7e6aa9cdeb315df24f3b67cb3
    secrets:
      ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
