name: OpenCode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    permissions:
      contents: read
      issues: write
      pull-requests: write
    uses: jhw7500/automation/.github/workflows/opencode.yml@b40074e89fbe039e5e605b8d65a1f758298830d9
    secrets:
      ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
