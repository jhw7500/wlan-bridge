name: OpenCode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    permissions:
      contents: read
      issues: write
      pull-requests: write
    uses: jhw7500/automation/.github/workflows/opencode.yml@abf5e65cf6188277d9984be062d0b069c82cf25f
    secrets:
      ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
