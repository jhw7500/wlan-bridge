name: OpenCode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    permissions:
      contents: read
      issues: write
      pull-requests: write
    uses: jhw7500/automation/.github/workflows/opencode.yml@2468b33e46e72f6cf862ba41d3d10fe7f50c4a8d
    secrets:
      ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
