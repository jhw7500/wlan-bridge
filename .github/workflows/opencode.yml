name: OpenCode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    permissions:
      contents: read
      issues: write
      pull-requests: write
    uses: jhw7500/automation/.github/workflows/opencode.yml@cec20f03a64a2930b9ef6e81ce5bbbeaac79fd68
    secrets:
      ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
