name: OpenCode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    permissions:
      contents: read
      issues: write
      pull-requests: write
    uses: jhw7500/automation/.github/workflows/opencode.yml@ac73b3308e29ef80d9cb01a92da376732978ba6c
    secrets:
      ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
