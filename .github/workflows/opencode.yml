name: OpenCode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    permissions:
      contents: read
      issues: write
      pull-requests: write
    uses: jhw7500/automation/.github/workflows/opencode.yml@ffdf5c1ff6237502ac67296ffabb9146d623c7a6
    secrets:
      ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
