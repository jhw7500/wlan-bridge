name: OpenCode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    permissions:
      contents: read
      issues: write
      pull-requests: write
    uses: jhw7500/automation/.github/workflows/opencode.yml@74afc0057c4732993ecd76601590b8856e2a3bb3
    secrets:
      ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
