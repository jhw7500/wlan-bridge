name: OpenCode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    permissions:
      contents: read
      issues: write
      pull-requests: write
    uses: jhw7500/automation/.github/workflows/opencode.yml@03461f81a8dd06b5cda34f2f9dba9acd925f2a85
    secrets:
      ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
