name: OpenCode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    permissions:
      contents: read
      issues: write
      pull-requests: write
    uses: jhw7500/automation/.github/workflows/opencode.yml@311278d5de6051583cde5f952372bad6cb77a3f0
    secrets:
      ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
