name: OpenCode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    permissions:
      contents: read
      issues: write
      pull-requests: write
    uses: jhw7500/automation/.github/workflows/opencode.yml@14f97fb4ec06bee2d138faa557bb3ebddc4de331
    secrets:
      ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
