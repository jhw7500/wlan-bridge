name: OpenCode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    permissions:
      contents: read
      issues: write
      pull-requests: write
    uses: jhw7500/automation/.github/workflows/opencode.yml@345cc7916e051e19fcf1480ddd503cf45a6a5ee1
    secrets:
      ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
