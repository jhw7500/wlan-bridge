name: OpenCode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    permissions:
      contents: read
      issues: write
      pull-requests: write
    uses: jhw7500/automation/.github/workflows/opencode.yml@79e87569272b865642c1d1493740135b567717ac
    secrets:
      ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
