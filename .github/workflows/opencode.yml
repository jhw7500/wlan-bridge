name: OpenCode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    permissions:
      contents: read
      issues: write
      pull-requests: write
    uses: jhw7500/automation/.github/workflows/opencode.yml@6d6bd5141169bf0d5ae8fac5b4fcd23f8b0014df
    secrets:
      ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
