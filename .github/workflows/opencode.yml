name: OpenCode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    permissions:
      contents: read
      issues: write
      pull-requests: write
    uses: jhw7500/automation/.github/workflows/opencode.yml@1b98172325533ef6ad37f3d2cfc3870073fac26d
    secrets:
      ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
