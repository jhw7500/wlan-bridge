name: OpenCode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    permissions:
      contents: read
      issues: write
      pull-requests: write
    uses: jhw7500/automation/.github/workflows/opencode.yml@fe7cd9008ed53fb3f1d2ae666a1f458cc828f4c7
    secrets:
      ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
