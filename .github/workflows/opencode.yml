name: OpenCode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    permissions:
      contents: read
      issues: write
      pull-requests: write
    uses: jhw7500/automation/.github/workflows/opencode.yml@c1595f277c819c7ccf9ff2ab3ad01e5afabdda45
    secrets:
      ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
