name: OpenCode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    permissions:
      contents: read
      issues: write
      pull-requests: write
    uses: jhw7500/automation/.github/workflows/opencode.yml@103db505b721bd5323272ccd3a93b182d5a8086a
    secrets:
      ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
