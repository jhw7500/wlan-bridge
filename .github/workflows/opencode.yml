name: OpenCode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    permissions:
      contents: read
      issues: write
      pull-requests: write
    uses: jhw7500/automation/.github/workflows/opencode.yml@938c130f3adc4ef9a451e5991f100e1acca63fec
    secrets:
      ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
