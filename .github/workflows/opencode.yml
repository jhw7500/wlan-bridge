name: OpenCode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    permissions:
      contents: read
      issues: write
      pull-requests: write
    uses: jhw7500/automation/.github/workflows/opencode.yml@ccd1b6f3e1833c82d73826c1332cc6e3e4841d30
    secrets:
      ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
