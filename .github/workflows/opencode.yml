name: OpenCode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    permissions:
      contents: read
      issues: write
      pull-requests: write
    uses: jhw7500/automation/.github/workflows/opencode.yml@effa74038020263f158c0ef54343577db4040d1b
    secrets:
      ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
