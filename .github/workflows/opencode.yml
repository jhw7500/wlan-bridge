name: OpenCode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    permissions:
      contents: read
      issues: write
      pull-requests: write
    uses: jhw7500/automation/.github/workflows/opencode.yml@a2c3ca4c6de37150ec174e897cce3dfb2e0c370c
    secrets:
      ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
