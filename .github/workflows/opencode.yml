name: OpenCode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    permissions:
      contents: read
      issues: write
      pull-requests: write
    uses: jhw7500/automation/.github/workflows/opencode.yml@f1b85510717a681b0db94fd2b764716372c52435
    secrets:
      ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
