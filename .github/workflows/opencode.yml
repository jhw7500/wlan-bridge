name: OpenCode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    permissions:
      contents: read
      issues: write
      pull-requests: write
    uses: jhw7500/automation/.github/workflows/opencode.yml@06b0f77baa88e04001fe3f6259a994571dcf5408
    secrets:
      ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
