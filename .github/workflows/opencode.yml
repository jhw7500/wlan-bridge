name: OpenCode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    permissions:
      contents: read
      issues: write
      pull-requests: write
    uses: jhw7500/automation/.github/workflows/opencode.yml@06183ff67c6052489ccac3b7cb37fd93aa3f6307
    secrets:
      ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
