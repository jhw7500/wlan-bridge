name: OpenCode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    permissions:
      contents: read
      issues: write
      pull-requests: write
    uses: jhw7500/automation/.github/workflows/opencode.yml@60e09a0ffaf1fa6548eb9a55533adc3607122b36
    secrets:
      ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
