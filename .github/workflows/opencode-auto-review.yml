name: OpenCode Auto Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  check-enabled:
    name: Check if enabled
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github

      - name: Check workflow config
        id: check
        uses: ./.github/actions/check-workflow-enabled
        with:
          workflow-name: opencode-auto-review

  auto-review:
    needs: check-enabled
    if: needs.check-enabled.outputs.enabled == 'true'
    permissions:
      contents: read
      pull-requests: write
      issues: write
    uses: jhw7500/automation/.github/workflows/opencode-auto-review.yml@v1.39
    secrets:
      ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
