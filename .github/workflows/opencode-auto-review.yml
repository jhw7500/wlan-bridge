name: OpenCode Auto PR Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  opencode-review:
    permissions:
      contents: read
      issues: write
      pull-requests: write
    uses: jhw7500/automation/.github/workflows/opencode-auto-review.yml@d3b102e2c1f62f6abf5a9a5a37da810e6ba3e7f5
    with:
      pr_number: ${{ github.event.pull_request.number }}
    secrets:
      ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
