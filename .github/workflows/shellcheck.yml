name: ShellCheck

on:
  push:
    branches: [ main, master ]
    paths:
      - '**/*.sh'
      - 'dumb/make-for-imx8'
      - '.github/workflows/shellcheck.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - '**/*.sh'
      - 'dumb/make-for-imx8'
      - '.github/workflows/shellcheck.yml'
  workflow_dispatch:

jobs:
  shellcheck:
    name: ShellCheck Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Run ShellCheck
        run: |
          set -euo pipefail

          files=$(git ls-files '*.sh' || true)
          if [ -n "$files" ]; then
            shellcheck -x -s bash -S warning -f gcc $files
          else
            echo "No .sh files tracked by git"
          fi

          # Also check scripts without a .sh extension.
          if [ -f dumb/make-for-imx8 ]; then
            shellcheck -x -s bash -S warning -f gcc dumb/make-for-imx8
          fi
