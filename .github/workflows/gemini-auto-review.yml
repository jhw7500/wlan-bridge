name: Gemini Auto Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  check-enabled:
    name: Check if enabled
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github

      - name: Check workflow config
        id: check
        uses: ./.github/actions/check-workflow-enabled
        with:
          workflow-name: gemini-auto-review

  auto-review:
    needs: check-enabled
    if: needs.check-enabled.outputs.enabled == 'true'
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    uses: jhw7500/automation/.github/workflows/gemini-auto-review.yml@v1.23
    secrets:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
