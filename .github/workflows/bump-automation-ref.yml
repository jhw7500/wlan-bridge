name: Bump automation workflow refs

on:
  push:
    branches:
      - main
      - master
    paths:
      - '.github/workflow-config.yml'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: bump-automation-ref
  cancel-in-progress: false

jobs:
  check-enabled:
    name: Check if enabled
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github

      - name: Check workflow config
        id: check
        uses: ./.github/actions/check-workflow-enabled
        with:
          workflow-name: bump-automation-ref

  bump:
    needs: check-enabled
    if: needs.check-enabled.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine automation_ref change
        id: ref
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail

          new_ref="$(grep -E '^automation_ref:' .github/workflow-config.yml | awk '{print $2}')"
          if [ -z "${new_ref}" ]; then
            echo "automation_ref missing in .github/workflow-config.yml" >&2
            exit 1
          fi

          old_ref=""
          if git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            old_ref="$(git show "${BEFORE}:.github/workflow-config.yml" 2>/dev/null | grep -E '^automation_ref:' | awk '{print $2}' || true)"
          fi

          echo "old_ref=${old_ref}" >> "$GITHUB_OUTPUT"
          echo "new_ref=${new_ref}" >> "$GITHUB_OUTPUT"

          if [ "${old_ref}" = "${new_ref}" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Stop if automation_ref unchanged
        if: steps.ref.outputs.changed != 'true'
        run: |
          echo "automation_ref unchanged; nothing to bump."

      - name: Rewrite workflow refs
        if: steps.ref.outputs.changed == 'true'
        env:
          NEW_REF: ${{ steps.ref.outputs.new_ref }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          new_ref = os.environ["NEW_REF"].strip()
          if not re.fullmatch(r"v\d+(?:\.\d+)?", new_ref):
            raise SystemExit(f"NEW_REF must look like v1.9 (got {new_ref!r})")

          root = Path(".github/workflows")
          pattern = re.compile(
            r"(jhw7500/automation/\.github/(?:workflows|actions)/[^@\s'\"]+@)v\d+(?:\.\d+)?"
          )

          changed_files = 0
          for path in sorted(root.rglob("*.yml")):
            text = path.read_text(encoding="utf-8")
            new_text, n = pattern.subn(r"\1" + new_ref, text)
            if n:
              path.write_text(new_text, encoding="utf-8")
              changed_files += 1

          print(f"rewrote {changed_files} file(s)")
          PY

          git status --porcelain

      # GITHUB_TOKEN은 workflows: write 권한이 없어 .github/workflows/*.yml
      # 수정을 push할 수 없음. APP_ID/APP_PRIVATE_KEY로 GitHub App token을
      # 발급해 workflows 권한을 가진 인증 컨텍스트를 확보한다.
      - name: Generate App token
        id: app-token
        if: steps.ref.outputs.changed == 'true'
        uses: actions/create-github-app-token@a8d616148505b5069dccd32f177bb87d7f39123b # ratchet:actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write

      - name: Create PR
        if: steps.ref.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          NEW_REF: ${{ steps.ref.outputs.new_ref }}
        run: |
          set -euo pipefail

          if git diff --quiet; then
            echo "No changes after rewrite; skipping PR."
            exit 0
          fi

          branch="chore/bump-automation-${NEW_REF}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # actions/checkout 이 심어둔 GITHUB_TOKEN 기반 remote 인증을 App token으로 교체.
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git checkout -b "$branch"
          git add .github/workflows
          git commit -m "chore: bump automation refs to ${NEW_REF}"
          git push -u origin "$branch"

          gh pr create \
            --base "${{ github.event.repository.default_branch }}" \
            --head "$branch" \
            --title "chore: bump automation refs to ${NEW_REF}" \
            --body "automation_ref updated in .github/workflow-config.yml; this PR rewrites all jhw7500/automation workflow/action refs to ${NEW_REF}."
