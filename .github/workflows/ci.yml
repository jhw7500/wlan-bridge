name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential libpcap-dev

      - name: Build dumb
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -pthread \
            dumb/dumb.c \
            -lpcap \
            -o dumb
